<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Share your product review, rating, installation date, and useful features.">
  <meta name="author" content="WDD 131 Student">
  <title>Product Review Form | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="form.html">Product Review</a>
    <p>Tell us about your experience</p>
  </header>

  <main>
    <section class="form-card" aria-labelledby="page-title">
      <div class="intro">
        <p class="eyebrow">YOUR FEEDBACK MATTERS</p>
        <h1 id="page-title">Product Review</h1>
        <p>Share your experience to help others make informed decisions.</p>
        <p class="required-note"><span aria-hidden="true">*</span> Required field</p>
      </div>

      <form method="get" action="review.html">
        <div class="form-field">
          <label for="product">Product Name <span class="required" aria-hidden="true">*</span></label>
          <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
          </select>
        </div>

        <fieldset class="form-field">
          <legend>Overall Rating <span class="required" aria-hidden="true">*</span></legend>
          <div class="rating-options">
            <label class="rating-choice" for="rating-1">
              <input type="radio" id="rating-1" name="rating" value="1" required>
              <span class="stars" aria-hidden="true">★</span><span class="rating-number">1</span>
            </label>
            <label class="rating-choice" for="rating-2">
              <input type="radio" id="rating-2" name="rating" value="2" required>
              <span class="stars" aria-hidden="true">★★</span><span class="rating-number">2</span>
            </label>
            <label class="rating-choice" for="rating-3">
              <input type="radio" id="rating-3" name="rating" value="3" required>
              <span class="stars" aria-hidden="true">★★★</span><span class="rating-number">3</span>
            </label>
            <label class="rating-choice" for="rating-4">
              <input type="radio" id="rating-4" name="rating" value="4" required>
              <span class="stars" aria-hidden="true">★★★★</span><span class="rating-number">4</span>
            </label>
            <label class="rating-choice" for="rating-5">
              <input type="radio" id="rating-5" name="rating" value="5" required>
              <span class="stars" aria-hidden="true">★★★★★</span><span class="rating-number">5</span>
            </label>
          </div>
        </fieldset>

        <div class="form-field">
          <label for="install-date">Date of Installation <span class="required" aria-hidden="true">*</span></label>
          <input type="date" id="install-date" name="install-date" required>
        </div>

        <fieldset class="form-field">
          <legend>Useful Features <span class="optional">(Check all that apply)</span></legend>
          <div class="checkbox-list">
            <label for="durability"><input type="checkbox" id="durability" name="features" value="Durability"> Durability</label>
            <label for="ease-of-use"><input type="checkbox" id="ease-of-use" name="features" value="Ease of use"> Ease of use</label>
            <label for="performance"><input type="checkbox" id="performance" name="features" value="Performance"> Performance</label>
            <label for="design"><input type="checkbox" id="design" name="features" value="Design"> Design</label>
          </div>
        </fieldset>

        <div class="form-field">
          <label for="written-review">Written Review <span class="optional">(Optional)</span></label>
          <textarea id="written-review" name="written-review" rows="5" placeholder="What did you like or dislike about this product?"></textarea>
        </div>

        <div class="form-field">
          <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
          <input type="text" id="user-name" name="user-name" autocomplete="name" placeholder="Enter your name">
        </div>

        <input class="submit-button" type="submit" value="Submit Review">
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="current-year"></span> · WDD 131 Product Review Form</p>
    <p>Last modified: <span id="last-modified"></span></p>
  </footer>
</body>
</html>
